name: Build Raven

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create filter plist
        run: |
          cat > Raven.plist <<'EOF'
          { Filter = { Bundles = ( "com.AlfaBravo.CombatMaster" ); }; }
          EOF

      - name: Patch dumper to filter output
        run: |
          python3 - <<'PYEOF'
          import sys

          TARGET = "write_tree.py"
          try:
              src = open(TARGET).read()
          except FileNotFoundError:
              print("[error] write_tree.py not found"); sys.exit(1)

          # 1. add <cstring> include so strstr works
          if "#include <cstring>" not in src:
              src = src.replace(
                  "#import <dlfcn.h>\n#import <objc/runtime.h>",
                  "#import <dlfcn.h>\n#import <objc/runtime.h>\n#include <cstring>"
              )
              print("[fix] added <cstring>")

          # 2. insert the filter inside dumpEverything's class loop
          anchor = '''    if (!cname) continue;
              dumped++;'''
          filt = '''    if (!cname) continue;
              {
                  const char* ns = cns ? cns : "";
                  bool keep = false;
                  const char* pats[] = {
                      "PlayerRoot","PlayerHealth","PlayerMovement",
                      "PlayerMobView","MobView","CameraController",
                      "ActiveMobView","LocalPlayer","MyPlayer","AllPlayers",
                      "PlayerManager","BattlePlayer","MapPlayer",
                      "PlayerState","PlayerCommand","PlayerMetadata",
                      NULL
                  };
                  for (int k = 0; pats[k]; k++) {
                      if (strstr(cname, pats[k]) || strstr(ns, pats[k])) { keep = true; break; }
                  }
                  if (!keep) continue;
              }
              dumped++;'''

          if anchor in src:
              src = src.replace(anchor, filt)
              print("[fix] filter injected")
          elif "strstr(cname, \"PlayerRoot\")" in src:
              print("[skip] filter already present")
          else:
              print("[warn] anchor not found — dump will stay unfiltered")

          open(TARGET, "w").write(src)
          PYEOF

      - name: Regenerate
        run: python3 write_tree.py

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-theos-v1

      - name: Setup Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --recursive --depth=1 https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/sdks
          curl -L https://github.com/theos/sdks/archive/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp/sdks
          mv /tmp/sdks/sdks-master/*.sdk $THEOS/sdks/

      - name: Install ldid
        run: brew install ldid

      - name: Build
        run: |
          export THEOS=${{ github.workspace }}/theos
          export PATH=$THEOS/bin:$PATH
          make clean
          make

      - name: Verify
        run: |
          DYLIB=$(find .theos -name 'Raven.dylib' -type f | head -n1)
          echo "dylib: $DYLIB"
          ls -la "$DYLIB"
          strings "$DYLIB" | grep -q "PlayerRoot" && echo "OK: filter strings present" || { echo "FAIL"; exit 1; }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: raven-dylib
          path: ${{ github.workspace }}/.theos/obj/debug/Raven.dylib
          if-no-files-found: error
