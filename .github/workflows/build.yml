name: Build RavenRecon

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate
        run: python3 write_tree.py

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-theos-v1

      - name: Setup Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --recursive --depth=1 https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/sdks
          curl -L https://github.com/theos/sdks/archive/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp/sdks
          mv /tmp/sdks/sdks-master/*.sdk $THEOS/sdks/

      - name: Install ldid
        run: brew install ldid

      - name: Build
        run: |
          export THEOS=${{ github.workspace }}/theos
          export PATH=$THEOS/bin:$PATH
          make clean
          make

      - name: Locate and verify
        id: locate
        run: |
          DYLIB=$(find .theos -name 'RavenRecon.dylib' -type f | head -n1)
          if [ -z "$DYLIB" ]; then
            echo "FAIL: RavenRecon.dylib not found"
            find .theos -name '*.dylib' -type f | head -20
            exit 1
          fi
          echo "found: $DYLIB"
          echo "dylib_path=$DYLIB" >> $GITHUB_OUTPUT
          ls -la "$DYLIB"
          lipo -info "$DYLIB" || true

          echo "--- checks ---"
          if strings "$DYLIB" | grep -q "RAVEN RECON DUMP v3"; then
            echo "OK: v3 magic string present"
          else
            echo "FAIL: v3 magic missing"
            exit 1
          fi
          if strings "$DYLIB" | grep -q "il2cpp_image_get_class"; then
            echo "OK: il2cpp API strings present"
          else
            echo "FAIL: il2cpp API strings missing"
            exit 1
          fi
          if strings "$DYLIB" | grep -q "recon_dump.txt"; then
            echo "OK: output filename present"
          else
            echo "FAIL: output filename missing"
            exit 1
          fi
          if strings "$DYLIB" | grep -q "recon_alive.txt"; then
            echo "OK: heartbeat filename present"
          else
            echo "FAIL: heartbeat filename missing"
            exit 1
          fi

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: ravenrecon-dylib
          path: ${{ steps.locate.outputs.dylib_path }}
          if-no-files-found: error
